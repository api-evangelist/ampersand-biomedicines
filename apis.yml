aid: ampersand-biomedicines
name: Ampersand Biomedicines
description: 'Ampersand Biomedicines is a Boston-based biotechnology company founded in 2020 out of Flagship
  Pioneering that designs programmable biologic medicines intended to act only at the site of disease. Its
  computationally powered Address, Navigate, Determine (AND) Platform pairs a multi-omics "Address Map" of
  healthy and diseased human tissue with high-throughput microfluidic binder generation and AI-guided binder
  prediction to design AND-Body therapeutics, which combine a localizing element with an actuator so activity
  is conditional on the target tissue. The company raised a $65M Series B in March 2025 from Flagship
  Pioneering and Eli Lilly, and partners with Pioneering Medicines and Pfizer. It is a preclinical
  therapeutics developer, not a software vendor: the computational platform is internal tooling for its own
  drug discovery and is not offered to third parties, and the company publishes no public API, developer
  portal, SDK, or machine-readable specification.'
